exclude = [
  '__pypackages__',
  '_build',
  '.bzr',
  '.direnv',
  '.eggs',
  '.git-rewrite',
  '.git',
  '.hg',
  '.ipynb_checkpoints',
  '.mypy_cache',
  '.nox',
  '.pants.d',
  '.pyenv',
  '.pytest_cache',
  '.pytype',
  '.ruff_cache',
  '.svn',
  '.tox',
  '.venv',
  '.vscode',
  '*.lock',
  'buck-out',
  'build',
  'dist',
  'node_modules',
  'site-packages',
  'venv',
]

line-length = 88
indent-width = 4
target-version = 'py312'

[lint]
select = ['ALL']
ignore = [
  'COM812',  # missing-trailing-comma
  'CPY001',  # missing-copyright-notice
  'ERA001',  # commented-out-code
  'PLR2004',  # magic-value-comparison
  'TD002',  # missing-todo-author
  'TD003',  # missing-todo-link
]

# The google convention turns D401 (imperative mood) off; the constitution wants it.
extend-select = ['D401']
fixable = ['ALL']
# Report a print rather than delete it.
unfixable = ['T201']
dummy-variable-rgx = '^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$'

[lint.flake8-quotes]
inline-quotes = 'single'

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
'__init__.py' = [
  'D104',  # undocumented-public-package
  'F401',  # unused-import
  'F403',  # undefined-local-with-import-star
]
'noxfile.py' = ['S603']  # subprocess-without-shell-equals-true
'tests/**/*.py' = ['S101']  # Use of assert
# Compares token-named `env:` entries, such as `GH_TOKEN`, with their expressions, and
# runs bot-automerge's provenance step under `bash` and `git` against a stub `gh`.
'tests/test_workflows.py' = [
  'PLR0913',  # too-many-arguments: the provenance stub takes one per answer it fakes
  'S105',  # hardcoded-password-string
  'S603',  # subprocess-without-shell-equals-true
  'S607',  # start-process-with-partial-path (`bash` and `git` off PATH)
]
# Run an action's script under `bash`, found on PATH.
'tests/test_{action,comment}.py' = [
  'S603',  # subprocess-without-shell-equals-true
  'S607',  # start-process-with-partial-path
]
# A test docstring states what holds rather than commanding.
'tests/**/test_*.py' = ['D401']
# Standalone scripts, not a package, that report on stdout.
'scripts/*.py' = [
  'INP001',  # implicit-namespace-package
  'T201',  # Use of print
]

[lint.pydocstyle]
convention = 'google'

[lint.pylint]
max-branches = 15
max-returns = 10

[format]
quote-style = 'single'
indent-style = 'space'
skip-magic-trailing-comma = false
line-ending = 'auto'
docstring-code-format = true
docstring-code-line-length = 'dynamic'
