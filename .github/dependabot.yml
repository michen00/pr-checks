---
version: 2
# Version updates only: a security update still opens a pull request of its own.
multi-ecosystem-groups:
  deps:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
# Each entry takes its schedule and commit message from the group above.
updates:
  - package-ecosystem: uv
    directory: /
    patterns: ['*']
    multi-ecosystem-group: deps
    cooldown:
      default-days: 7
  - package-ecosystem: pre-commit
    directory: /
    patterns: ['*']
    multi-ecosystem-group: deps
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directories: [/, /comment]
    patterns: ['*']
    multi-ecosystem-group: deps
    cooldown:
      # GitHub rejects the semver-* keys for this ecosystem, and an invalid key
      # drops this whole entry, grouping included. The check-dependabot hook
      # does not catch it: GitHub rejects the key when it reads the file.
      default-days: 7
