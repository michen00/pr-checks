---
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    groups:
      uv-major:
        update-types: [major]
      uv-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
    cooldown:
      default-days: 7
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ['*']
    commit-message:
      prefix: chore
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore
    cooldown:
      # GitHub rejects the semver-* keys for this ecosystem, and an invalid key
      # drops this whole entry, grouping included. The check-dependabot hook
      # does not catch it: GitHub rejects the key when it reads the file.
      default-days: 7
