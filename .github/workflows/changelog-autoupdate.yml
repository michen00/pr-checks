---
name: Changelog autoupdate
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BRANCH_NAME: chore/changelog-autoupdate
  # Kept in step with .python-version.
  PYTHON_VERSION: '3.13'

jobs:
  # Builds the changelog under the read-only token, so none of these tools runs
  # beside the write token the pull-request job holds.
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install git-cliff
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: git-cliff
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: ${{ env.PYTHON_VERSION }}
      # git-cliff maps commit authors to GitHub handles through the API.
      - name: Update Unreleased section
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/update-unreleased.sh
      # The first pass may rewrite the file and so fail; the second must not.
      - name: Format and validate the changelog
        run: |
          uv run --locked --only-group ci pre-commit run --files CHANGELOG.md ||
            uv run --locked --only-group ci pre-commit run --files CHANGELOG.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog
          path: CHANGELOG.md

  pull-request:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # create-pull-request sets its own credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog
      - name: Push changes and create PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ env.BRANCH_NAME }}
          sign-commits: true
          title: 'docs(CHANGELOG.md): autoupdate Unreleased section'
          body: |
            ## Summary

            This PR regenerates the Unreleased section of `CHANGELOG.md` with git-cliff.

            ## Testing

            - [x] The repository's Markdown hooks formatted and passed the file
          commit-message: 'docs(CHANGELOG.md): autoupdate Unreleased section'
          delete-branch: true
          base: main
