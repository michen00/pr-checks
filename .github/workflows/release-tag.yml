---
name: Release Tag

# Runs when a release PR's commit lands on main. The job waits on the protected
# `release` environment, so the release key is read only once a maintainer approves
# the run, which `make release-approve` does.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-tag:
    # A squash merge takes the release PR's title as the commit's subject.
    if: >-
      startsWith(github.event.head_commit.message, 'chore(release): prepare v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The subject names the release, and the release PR set pyproject.toml's
      # version to match, so a commit retitled at merge is refused.
      - name: Resolve the release tag
        id: release-tag
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s HEAD)"
          tag="$(scripts/release/subject-tag.sh "$subject")"
          version="$(python3 -I -c 'import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])')"
          if [ "$tag" != "v$version" ]; then
            echo "::error::'$subject' names $tag, but pyproject.toml's version is $version."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "major=${tag%%.*}"
          } >>"$GITHUB_OUTPUT"

      # The commit must be the merge of this repository's release/vX.Y.Z branch, which
      # Release PR creates, as in freeze-pr-links.
      - name: Check that the release branch was merged
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          merged="$(gh api "repos/$REPO/commits/$sha/pulls" |
            jq --arg repo "$REPO" --arg branch "release/$RELEASE_TAG" \
              '[.[] | select(.merged_at != null and .head.ref == $branch
                and .head.repo.full_name == $repo)] | length')"
          if [ "$merged" != 1 ]; then
            echo "::error::$sha is not the merge of $REPO's release/$RELEASE_TAG branch."
            exit 1
          fi

      - name: Import the release key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_tag_gpgsign: true
          trust_level: 5

      # The checkout keeps no credential, so the token reaches each push through the
      # environment and never .git/config. A rerun accepts an existing tag only when
      # it is a validly signed annotated tag on this commit.
      - name: Create and push the signed tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            existing="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$existing" != "$head_sha" ]; then
              echo "::error::Tag $RELEASE_TAG already exists at $existing, not at $head_sha."
              exit 1
            fi
            if ! git verify-tag "$RELEASE_TAG"; then
              echo "::error::Tag $RELEASE_TAG is not a validly signed annotated tag."
              exit 1
            fi
            echo "Tag $RELEASE_TAG already points at $head_sha and is signed."
            exit 0
          fi
          git tag -a -s "$RELEASE_TAG" -m "$RELEASE_TAG"
          git verify-tag "$RELEASE_TAG"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin "refs/tags/$RELEASE_TAG"

      # Callers pin the check action to the major tag, so it follows each release
      # forward and never back. version-tags-immutable covers only refs/tags/v*.*.*,
      # and tags-no-delete stops a deletion, not a move.
      - name: Move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
          MAJOR_TAG: ${{ steps.release-tag.outputs.major }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if current="$(git rev-parse -q --verify "refs/tags/$MAJOR_TAG^{commit}")"; then
            if [ "$current" = "$head_sha" ]; then
              echo "$MAJOR_TAG already points at $head_sha."
              exit 0
            fi
            if ! git merge-base --is-ancestor "$current" "$head_sha"; then
              echo "::notice::$MAJOR_TAG is at $current, ahead of $RELEASE_TAG; leaving it."
              exit 0
            fi
          fi
          git tag -f -a -s "$MAJOR_TAG" -m "$RELEASE_TAG" "$head_sha"
          git verify-tag "$MAJOR_TAG"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push --force origin "refs/tags/$MAJOR_TAG"

      # The notes are the release's CHANGELOG.md section; .github/release.yml shapes
      # the generated notes used when there is none. A rerun repairs the release in
      # place, since the tag rulesets refuse deleting a tag to start again.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v v="${RELEASE_TAG#v}" '
            index($0, "## [" v "]") == 1 { in_section = 1; next }
            in_section && (index($0, "## [") == 1 || /^<!-- generated by git-cliff -->/) { exit }
            in_section { print }
          ' CHANGELOG.md >"$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if grep -q '[^[:space:]]' "$notes"; then
              gh release edit "$RELEASE_TAG" --notes-file "$notes"
            fi
          elif grep -q '[^[:space:]]' "$notes"; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --generate-notes
          fi
