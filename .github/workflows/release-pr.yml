---
name: Release PR

# A push is speculative and ends quietly when there is nothing worth releasing. A
# dispatch is a person asking for a release, so it skips the worthiness gate and
# fails where a push would end quietly. The `stop` helper below is that one decision.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (0.1.0 or v0.1.0); leave empty to infer'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

env:
  # Kept in step with .python-version.
  PYTHON_VERSION: '3.13'

jobs:
  resolve:
    # Merging a release PR is itself a push to main, made before its tag exists.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release): prepare')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      branch: ${{ steps.version.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Pinning install-action pins the git-cliff version it installs too.
      - name: Install git-cliff
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: git-cliff

      # git-cliff maps commit authors to GitHub handles through the API, where an
      # unauthenticated request may be rate-limited.
      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            speculative=1
          else
            speculative=0
          fi

          stop() {
            if [ "$speculative" -eq 1 ]; then
              echo "release=false" >>"$GITHUB_OUTPUT"
              echo "::notice::$1"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }

          # A merged release whose tag waits on approval, or whose approval was
          # rejected, holds the next one back until it is tagged; RELEASING.md's
          # manual fallback clears it. Assigned without `|| true`, so a failed
          # lookup fails the step rather than reading as no release in flight.
          prep="$(git log -1 --format=%s --grep='^chore(release): prepare v')"
          if [ -n "$prep" ]; then
            if pending="$(scripts/release/subject-tag.sh "$prep" 2>/dev/null)"; then
              if ! git rev-parse -q --verify "refs/tags/$pending" >/dev/null; then
                stop "$pending is prepared but not tagged yet; a release is in flight."
              fi
            fi
          fi

          raw="$RELEASE_VERSION_INPUT"
          if [ -z "$raw" ]; then
            raw="$(git cliff --bumped-version)"
            echo "Inferred version from conventional commits: $raw"
          fi

          if ! tag="$(scripts/release/parse-version.sh "$raw")"; then
            echo "::error::Invalid version '$raw'. Use X.Y.Z or vX.Y.Z."
            exit 1
          fi

          # With no releasable commits, --bumped-version echoes the current tag.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            stop "Tag $tag already exists. Nothing to release."
          fi

          # Every conventional type bumps at least the patch, so a push also needs a
          # commit that cliff.toml groups as a feature, fix, performance change or
          # revert (indexes 00 to 03), or one marked breaking. --unreleased also
          # returns the previous release, hence the null-version filter.
          if [ "$speculative" -eq 1 ]; then
            worthy="$(git cliff --unreleased --context |
              jq '[.[] | select(.version == null) | .commits[]
                   | select(.breaking or ((.group // "") | test("^<!-- (00|01|02|03) -->")))]
                  | length')"
            if [ "$worthy" -eq 0 ]; then
              stop "Nothing since the last release is worth one; not proposing $tag."
            fi
            echo "Release-worthy commits behind $tag: $worthy"
          fi

          {
            echo "release=true"
            echo "tag=$tag"
            echo "branch=release/$tag"
          } >>"$GITHUB_OUTPUT"

  # Stamps, formats and tests under the read-only token, so none of these tools runs
  # beside the write token the release-pr job holds.
  prepare:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: git-cliff

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: ${{ env.PYTHON_VERSION }}

      # A handle that came back unresolved would read as a lost released entry.
      - name: Stamp the release into the changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: scripts/release/stamp-changelog.sh "$RELEASE_TAG"

      # The first pass may rewrite the file and so fail; the second must not.
      - name: Format and validate the changelog
        run: |
          uv run --locked --only-group ci pre-commit run --files CHANGELOG.md ||
            uv run --locked --only-group ci pre-commit run --files CHANGELOG.md

      # uv.lock names the project's version, and `uv run --locked` fails on a stale one.
      - name: Bump the package version
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          uv version "${RELEASE_TAG#v}"
          uv lock

      - name: Bump the README pin
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: scripts/release/bump-pins.sh "$RELEASE_TAG" README.md

      - name: Validate the bumped README
        run: uv run --locked --only-group ci pre-commit run --files README.md

      - name: Run tests
        run: uv run --locked --only-group ci nox -s test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            CHANGELOG.md
            README.md
            pyproject.toml
            uv.lock
          if-no-files-found: error

  release-pr:
    needs: [resolve, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # create-pull-request sets its own credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      # A file rather than an inline block, so the body is linted as Markdown and
      # is not hard-wrapped at yamllint's column limit. The tag has been through
      # parse-version.sh, so it holds no sed metacharacter.
      - name: Render the release PR body
        id: body
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          rendered="$RUNNER_TEMP/release-pr-body.md"
          sed "s/@RELEASE_TAG@/${RELEASE_TAG}/g" .github/release-pr-body.md >"$rendered"
          echo "path=$rendered" >>"$GITHUB_OUTPUT"

      # sign-commits commits through the API, which GitHub signs.
      - name: Create release PR
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ needs.resolve.outputs.branch }}
          base: main
          delete-branch: true
          sign-commits: true
          title: 'chore(release): prepare ${{ needs.resolve.outputs.tag }}'
          commit-message: 'chore(release): prepare ${{ needs.resolve.outputs.tag }}'
          add-paths: |
            CHANGELOG.md
            README.md
            pyproject.toml
            uv.lock
          body-path: ${{ steps.body.outputs.path }}

      # The branch carries the version, so a version that moves while a release PR
      # is open opens a second PR. Merging the first would release an older version
      # from a commit that no longer describes the release, so it is closed. Only
      # this repository's own branches are touched, never a fork's.
      - name: Close superseded release PRs
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP_BRANCH: ${{ needs.resolve.outputs.branch }}
          KEEP_TAG: ${{ needs.resolve.outputs.tag }}
          NEW_PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          # Assigned, not piped, so a failed query fails the step.
          open_release_prs="$(gh pr list --state open --base main \
            --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not)
                      | select(.headRefName | startswith("release/"))
                      | "\(.number)\t\(.headRefName)"')"

          while IFS="$(printf '\t')" read -r number branch; do
            if [ -z "$number" ] || [ "$branch" = "$KEEP_BRANCH" ]; then
              continue
            fi
            echo "::notice::Closing superseded release PR #${number} (${branch})."
            gh pr close "$number" --delete-branch \
              --comment "Superseded by #${NEW_PR}, preparing ${KEEP_TAG}."
          done <<<"$open_release_prs"
